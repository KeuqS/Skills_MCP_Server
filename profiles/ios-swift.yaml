guidelines:
  - "Human Interface Guidelines: Adhere strictly to Apple's Human Interface Guidelines (HIG), ensuring platform-appropriate navigation, typography, dynamic type support, and accessible interactions."
  - "Native components: Favor SwiftUI-native components and platform-appropriate interaction patterns, adapting layouts to iOS safe areas and adaptive size classes."
  - "MainActor isolation: Apply @MainActor to UI-facing state, view models, and UI update operations to guarantee main-thread execution and prevent background rendering anomalies."
  - "Retain cycle prevention: Use [weak self] where needed to prevent retain cycles, particularly in escaping closures, delegate callbacks, and long-lived asynchronous tasks."
  - "Safe unwrapping: Avoid force-unwrapping (!) and unsafe concurrency patterns unless clearly justified; use optional binding (guard let, if let) and defensive error handling."
  - "Structured concurrency: Use structured concurrency (async let, TaskGroup) and propagate task cancellation correctly by checking Task.isCancelled during cooperative execution."
  - "State observation: Choose Combine (ObservableObject, @Published) or the Observation framework (@Observable) according to deployment targets and project architecture."
  - "Persistence separation: Keep Core Data and SwiftData persistence logic separate from presentation code using dedicated repositories or service layers."
  - "SwiftUI previews: Use previews or #Preview macros for rapid SwiftUI iteration, employing PreviewProvider where appropriate for the project's supported Xcode version."
  - "Deterministic testing: Write deterministic XCTest unit and integration tests, isolating external network and system dependencies with protocol-based mocks."
  - "Dependency management: Manage packages through Swift Package Manager (SPM) with pinned semantic versions, avoiding unnecessary third-party dependencies."
  - "Empirical profiling: Profile with Instruments (Time Profiler, Allocations, Leaks) before applying performance optimizations, addressing verified bottlenecks first."
