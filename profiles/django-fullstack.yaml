id: django-fullstack
name: Django Fullstack Developer
description: Production-grade Django full-stack web application development workflow with ORM optimization, Django REST Framework, authentication, migrations, and pytest-django
version: "1.0.0"
skills:
  # 1. Django ORM optimization
  - django-orm-optimization
  - select-related-prefetch-related
  - query-profiling-n-plus-one
  # 2. Django REST Framework
  - djangorestframework
  - drf-serializers-viewsets
  - drf-routers-permissions
  - input-validation-pagination
  # 3. Authentication and authorization
  - django-auth-sessions
  - permission-classes-authorization
  - object-level-permissions
  # 4. Database migrations
  - safe-reversible-migrations
  - migration-dependency-management
  - data-migrations-planning
  # 5. Testing with pytest-django
  - pytest-django
  - fixtures-database-isolation
  - transaction-testing
  # 6. Full-stack integration
  - fullstack-integration
