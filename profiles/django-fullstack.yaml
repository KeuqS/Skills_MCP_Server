  - static-asset-management
  # Core workflow skills
  - django
  - celery
  - postgresql
  - redis
  - ponytail
  - review
  - verification-before-completion
guidelines:
  - "ORM efficiency: Use select_related() for suitable foreign-key and one-to-one relationships, and prefetch_related() for many-to-many and reverse relationships to eliminate N+1 queries."
  - "Query inspection: Detect N+1 queries and inspect query performance using query profiling, connection queries logging, and query count assertions in tests."
  - "Secure settings: Enforce secure production settings with DEBUG=False, environment variable configuration, and production secret management without hardcoded keys."
  - "Web security: Enforce CSRF protection, secure cookie flags (SESSION_COOKIE_SECURE, CSRF_COOKIE_SECURE), HTTPS redirection, and appropriate security headers (HSTS, CSP, X-Frame-Options)."
  - "Atomic transactions: Wrap multi-operation database writes in transaction.atomic() to ensure consistency and prevent partial data persistence."
  - "Boundary validation: Implement robust input validation at serializer, form, and model clean() boundaries with consistent, structured error responses."
  - "Explicit authorization: Enforce explicit authentication and authorization checks using DRF permission classes, model permissions, and object-level authorization."
  - "Safe migrations: Create safe, reversible database migrations where practical, manage migration dependencies cleanly, and test data migrations before production rollout without destructive changes."
  - "Automated testing: Write comprehensive unit and integration tests for models, views, serializers, and APIs using pytest-django, database isolation, fixtures, and regression test suites."
  - "Observability & safety: Configure structured logging, error handling, and production observability while avoiding hardcoded secrets, unsafe raw SQL, and exposing sensitive endpoint data."
